allowBuilds:
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  tree-sitter: true
  tree-sitter-json: true

overrides:
  tmp: '~0.2.6'
  'qs@<6.17.1': '^6.17.1'
  'dompurify@<3.4.17': '^3.4.17'
  form-data: '^4.0.6'
  tar: '^7.5.18'
  'undici@<6.29.1': '^6.29.1'
  js-yaml: '^4.3.2'
  axios: '^1.20.0'
  # follow-redirects >=1.16.0 <1.16.1: CVE-2026-111755, CVE-2026-111756 (vía swagger-client > apidom-reference > axios).
  # El parche llega en 1.16.1; el suelo es 1.16.2 por ser la versión auditada.
  'follow-redirects@<1.16.2': '^1.16.2'
  brace-expansion: '^5.0.12'
  'body-parser@<2.4.0': '^2.4.0'
  'fast-uri@<3.1.9': '^3.1.9'
  immutable: '^4.3.9'
  http-cache-semantics: '^4.2.1'
  proxy-addr: '^2.0.8'
  '@xmldom/xmldom@>=0.9.0': '^0.9.12'
  '@xmldom/xmldom@<0.9.0': '^0.8.15'
  # sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c) no tiene versión parcheada: se elimina del árbol
  global-agent: '^4.1.3'
  'remarkable>argparse': '^2.0.1'
  # minimatch <11.0.1: GHSA-g3hv-75wg-m249. Solo se fuerzan 9.x/10.x (misma API que 11);
  # 3.x y 5.x (eslint, electron-builder) no tienen parche y cambiar de major las rompería.
  'minimatch@>=9.0.0 <11.0.1': '^11.0.4'

auditConfig:
  ignoreGhsas:
    # deepmerge <=4.3.1 (vía swagger-ui > swagger-client) no tiene versión parcheada; riesgo bajo aceptado
    - GHSA-gcqx-w48m-w2h4
